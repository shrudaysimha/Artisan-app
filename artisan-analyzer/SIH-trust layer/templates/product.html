<!DOCTYPE html>

<html>

<head>

    <title>Product Passport</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .verified {
            text-align: center;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .row {
            margin: 15px 0;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>Digital Product Passport</h1>

    <div class="verified">
        ✓ Product Record Found
    </div>

    <div class="row">
        <strong>Product ID:</strong>
        {{ product.product_id }}
    </div>

    <div class="row">
        <strong>Product:</strong>
        {{ product.product_name }}
    </div>

    <div class="row">
        <strong>Artisan:</strong>
        {{ product.artisan_name }}
    </div>

    <div class="row">
        <strong>Craft:</strong>
        {{ product.craft_type }}
    </div>

    <div class="row">
        <strong>Material:</strong>
        {{ product.material }}
    </div>

    <div class="row">
        <strong>Origin:</strong>
        {{ product.origin }}
    </div>

    <div class="row">
        <strong>Price:</strong>
        ₹{{ product.price }}
    </div>

</div>

</body>

</html>
